name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Dummy values — the test suite and build are fully offline.
      DATABASE_URL: postgres://user:pass@localhost:5432/ci
      BETTER_AUTH_SECRET: ci-dummy-better-auth-secret-32-chars-min
      BETTER_AUTH_URL: http://localhost:3000
      GITHUB_CLIENT_ID: dummy-github-client-id
      GITHUB_CLIENT_SECRET: dummy-github-client-secret
      NVIDIA_API_KEY: dummy-nvidia-api-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run lint:ox
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run eval:retrieval
      - run: npm run build
